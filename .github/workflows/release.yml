name: Windows signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching package.json, e.g. v0.1.2'
        required: true
        type: string
      publish:
        description: 'Publish Release after building; false saves signed artifacts for manual publication'
        required: true
        default: true
        type: boolean
      validation_ref:
        description: 'Optional commit with test/publisher-only fixes for rebuilding an existing tag; requires publish=false'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VITE_VERIFY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_ref || inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify recovery validation differs only in tests and release tooling
        if: github.event_name == 'workflow_dispatch' && inputs.validation_ref != ''
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          VALIDATION_REF: ${{ inputs.validation_ref }}
        shell: pwsh
        run: node scripts/verify-release-recovery.mjs "$env:RELEASE_TAG" "$env:VALIDATION_REF" "$env:RELEASE_PUBLISH"
      - name: Check out release tooling for its tests
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.validation_ref || github.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/publish-release.mjs
            scripts/publish-release.test.mjs
            scripts/verify-release-recovery.mjs
            scripts/verify-release-recovery.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          node scripts/version.mjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match package.json' }
      - run: npm test
        env:
          # Migration fixtures use UTC midnight with Asia/Shanghai activity-day expectations.
          # Scope the fixture timezone to tests; the packaged app still uses the user's timezone.
          TZ: Asia/Shanghai
      - name: Test release tooling
        run: node --experimental-test-module-mocks --test --test-timeout=60000 .release-tooling/scripts/publish-release.test.mjs .release-tooling/scripts/verify-release-recovery.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/eslint/bin/eslint.js src
      - name: Restore the tagged source for the signed build
        if: github.event_name == 'workflow_dispatch' && inputs.validation_ref != ''
        shell: pwsh
        run: |
          git checkout --detach "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build
      - name: Preserve signed NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}-signed-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
      - name: Publish complete private release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/publish-release.mjs --tag "$env:RELEASE_TAG" --notes "docs/releases/$version.md" --installer "src-tauri/target/release/bundle/nsis/单轨_${version}_x64-setup.exe"
